[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietaxlegal-backend"
version = "0.1.0"
description = "Authentication and legal chat API for VieTaxLegal"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "httpx>=0.28",
  "langchain-anthropic>=1.0",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "PyJWT>=2.15",
  "pwdlib[argon2]>=0.2",
  "qdrant-client>=1.19,<1.20",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

# Offline corpus tooling (PDF text extraction); not needed by the app or CI tests.
corpus = [
  "pymupdf>=1.24",
]

# Stock LangChain baseline for the eval comparison (rag_eval/langchain_baseline.py); not needed by the app.
eval-baseline = [
  "langchain-text-splitters>=1.0",
]

# Local BKAI embedding model (CPU torch, large download); experiment 4 only.
local-embed = [
  "sentence-transformers>=3",
  "pyvi>=0.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
include = ["app*"]
