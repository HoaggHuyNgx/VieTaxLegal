# One-command demo: docker compose up --build   ->  http://localhost:3000
# Secrets come from the shell or a root-level `.env` (never committed); see backend/.env.example.
# The database is Supabase (no Postgres container): pass its Session pooler URL as DATABASE_URL.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.2 # keep in sync with the pinned qdrant-client minor
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333" # dashboard / ingest scripts from the host; loopback only
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      - qdrant
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (Supabase Session pooler URL)}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>=32 random chars)}
      CORS_ORIGINS: http://localhost:3000
      LOG_JSON: "true"
      # Trust X-Forwarded-For from any peer: the backend publishes no port, so its only
      # client is the nginx container, which overwrites the header with the real address.
      FORWARDED_ALLOW_IPS: "*"
      CHAT_PROVIDER: ${CHAT_PROVIDER:-anthropic}
      CHAT_MODEL: ${CHAT_MODEL:-claude-sonnet-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Google sign-in stays off while the id/secret are blank. The browser reaches the API through
      # nginx on :3000, so the callback must be registered in Google Console with that origin.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/auth/google/callback}
      FRONTEND_URL: http://localhost:3000
      # Registration codes are sent over SMTP; without SMTP_HOST password registration is off.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./backend/corpus:/app/corpus:ro # source of truth for RAG; the index is rebuildable
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  qdrant_data:
