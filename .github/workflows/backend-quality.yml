name: Backend quality

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -c constraints.txt -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run linter
        run: python -m ruff check app tests

      - name: Check formatting
        run: python -m ruff format --check app tests

  migrations:
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: vietaxlegal
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vietaxlegal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vietaxlegal -d vietaxlegal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway values for the service container above; not real credentials.
      DATABASE_URL: postgresql+psycopg://vietaxlegal:ci-only-password@localhost:5432/vietaxlegal_test
      JWT_SECRET: ci-only-jwt-secret-for-migration-checks-0123456789
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -c constraints.txt -e ".[dev]"

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Check models match migrations
        run: python -m alembic check

      - name: Round-trip downgrade and upgrade
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head
