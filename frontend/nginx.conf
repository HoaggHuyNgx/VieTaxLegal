server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. The CSP is strict because the app loads only its own bundle plus
    # Google Fonts; `img-src 'self' data:` also stops an answer's markdown from pulling (and
    # leaking through) external images. HSTS belongs on the TLS terminator in front of this.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Compress text assets. webp is already compressed so it is left out, and text/event-stream
    # is deliberately absent: proxied /api responses (gzip_proxied defaults to off) must reach the
    # client unbuffered and uncompressed so the chat SSE stream stays incremental.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # Caching uses `expires` on purpose, never `add_header`: an add_header inside a location
    # replaces every server-level add_header (CSP, nosniff, ...) for that location.
    # Vite content-hashes everything under /assets/, so a year is safe; a missing file must 404
    # instead of falling back to index.html (which would be cached for a year as "a script").
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html names the current hashed bundles: always revalidate (Cache-Control: no-cache) so a
    # new deploy is picked up. Deep links such as /chat fall back here too (internal redirect).
    location = /index.html {
        expires -1;
    }

    # Same-origin API proxy, mirroring the Vite dev proxy: the session cookie stays first-party.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        # Overwrite, never append: a client-supplied X-Forwarded-For must not reach the
        # backend, which uses this address as the rate-limit key.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE chat stream: do not buffer, allow long-lived responses.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # React Router: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
